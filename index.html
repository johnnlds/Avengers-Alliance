<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101722">
  <title>Marvel Alliance — Character Select</title>
  <link rel="stylesheet" href="select.css?v=20261026-6">
  <script src="select.js?v=20261027-8" defer></script>
</head>
<body>
  <main class="select-shell">
    <header class="select-header">
      <p class="eyebrow">S.H.I.E.L.D. PERSONNEL FILES</p>
      <h1>MARVEL <span>ALLIANCE</span></h1>
      <p class="subtitle">Assemble your squad before entering the battlefield.</p>
    </header>
    <section class="selection-panel" aria-labelledby="selectionTitle">
      <div class="selection-heading">
        <div><p class="eyebrow">MISSION BRIEFING</p><h2 id="selectionTitle">Select Your Heroes</h2></div>
        <p id="selectionCount" class="selection-count" aria-live="polite">3 / 3 selected</p>
      </div>
      <p class="instructions">Choose 1–3 heroes. Your lineup will carry into the battle.</p>
      <section class="character-section" aria-labelledby="unlockedTitle"><h3 id="unlockedTitle" class="character-section-title">Unlocked</h3><div id="unlockedCharacterGrid" class="character-grid"></div></section><section class="character-section locked-section" aria-labelledby="lockedTitle"><h3 id="lockedTitle" class="character-section-title">Locked</h3><div id="lockedCharacterGrid" class="character-grid"></div></section>
      <p id="selectionError" class="selection-error" role="alert"></p>
      <div class="launch-row">
        <button id="selectAllBtn" class="secondary-button" type="button">Select All</button>
        <button id="startBattleBtn" class="primary-button" type="button">Enter Battle <span aria-hidden="true">→</span></button>
      </div>
    </section>
    <footer>FIELD OPERATIONS • S.H.I.E.L.D. INTERNAL ACCESS</footer>
  </main>
</body>
</html>
