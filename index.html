<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101722">
  <title>Marvel Alliance - Battle Prototype</title>
  <link rel="stylesheet" href="style.css?v=20261023-17">
  <script src="game.js?v=20261023-14" defer></script>
</head>
<body>
  <header class="topbar">
    <div>
      <h1>MARVEL <span>ALLIANCE</span></h1>
      <p class="subtitle">TACTICAL COMBAT PROTOTYPE</p>
    </div>
    <div class="battle-info">
      <span id="roundLabel">ROUND 1</span>
      <span id="turnLabel">YOUR TURN</span>
    </div>
  </header>

  <section id="turnOrder" class="turn-order" aria-label="Turn order"></section>

  <main class="game">
    <section class="battlefield">
      <div class="battle-side hero-side">
        <div class="team-heading">
          <h2>YOUR TEAM</h2>
          <span id="heroCount">3 ACTIVE</span>
        </div>
        <div id="heroTeam" class="team-grid"></div>
      </div>
      <div class="battle-divider" aria-hidden="true"><span>VS</span></div>
      <div class="battle-side enemy-side">
        <div class="team-heading enemy-heading">
          <h2>HYDRA FORCES</h2>
          <span id="enemyCount">3 ACTIVE</span>
        </div>
        <div id="enemyTeam" class="team-grid"></div>
      </div>
    </section>

    <section id="teamRoster" class="team-roster" aria-label="Team health and stamina"></section>

    <section class="combat-panel">
      <h3 class="section-heading">AVAILABLE MOVES — TAP TO USE</h3>
      <div id="abilityList" class="ability-list"></div>

      <div class="action-row">
        <button id="endTurnBtn" class="secondary-button">Skip Turn</button>
        <button id="restartBtn" class="secondary-button">Restart Battle</button>
      </div>
    </section>

    <section class="log-panel">
      <div class="log-heading">
        <h2>BATTLE LOG</h2>
        <button id="clearLogBtn" class="text-button">Clear</button>
      </div>
      <div id="battleLog" class="battle-log" aria-live="polite"></div>
    </section>
  </main>

  <div id="resultOverlay" class="overlay hidden">
    <div class="result-card">
      <p class="eyebrow">BATTLE COMPLETE</p>
      <h2 id="resultTitle">VICTORY</h2>
      <p id="resultMessage"></p>
      <button id="playAgainBtn" class="primary-button">Play Again</button>
    </div>
  </div>
</body>
</html>
